# Docker Compose 등 컨테이너 환경용 (spring.profiles.active=docker)
# 로컬 IDE / ./gradlew bootRun 은 application.yml(localhost)만 사용한다.
# 배포(EC2): docker-compose-prod.yml 가 SPRING_RABBITMQ_* / .env.deploy RABBITMQ_* 로 host.docker.internal 등을 넘긴다.

spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:false}

proxy:
  key-service:
    # identity-service 는 호스트에서 실행 — 컨테이너 proxy 가 호스트로 접근 (Docker Desktop / Linux host-gateway)
    # identity 기본 포트 8090 (게이트웨이 8080 과 혼동하지 않도록 기본값을 identity 에 맞춤)
    base-url: ${PROXY_KEY_SERVICE_BASE_URL:http://host.docker.internal:8090}
